name: Update live scores

on:
  schedule:
    - cron: '1-59/5 * * * *'  # every 5 min — each run loops for match duration
    - cron: '0 * * * *'       # every hour — always fetches once (keeps data fresh)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: score-updates
  cancel-in-progress: false  # let running job finish; only one pending slot is kept

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Fetch and commit scores
        env:
          FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
        run: |
          # 5-min schedule: loop every 5 min for up to 50 min so we don't depend on
          # GitHub re-triggering the schedule reliably (it's known to miss triggers).
          # Hourly schedule / manual: run once to keep baseline data fresh.
          if [[ "${{ github.event.schedule }}" == "1-59/5 * * * *" ]]; then
            ITERATIONS=10
            ARGS="--check-window"
          else
            ITERATIONS=1
            ARGS=""
          fi

          for i in $(seq 1 $ITERATIONS); do
            if [ "$i" -gt 1 ]; then
              echo "--- Sleeping 5 min (iteration $i/$ITERATIONS) ---"
              sleep 300
              git pull --rebase origin main
            fi

            OUTPUT=$(python3 scripts/update_scores.py $ARGS 2>&1)
            echo "$OUTPUT"

            if echo "$OUTPUT" | grep -q "No match in window"; then
              echo "No active match — stopping loop."
              break
            fi

            if ! git diff --quiet matches.json; then
              git add matches.json
              git commit -m "chore: update live scores"
              git push
            else
              echo "No score changes."
            fi
          done
