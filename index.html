  *{box-sizing:border-box}

  header p{margin:2px 0 0;font-size:12px;color:var(--muted)}
  .view-tabs{display:flex;gap:4px;padding:3px;border:1px solid var(--line);border-radius:10px;background:#10131a;flex-shrink:0}
  .view-tab{border:0;border-radius:7px;background:transparent;color:var(--muted);font-size:12px;font-weight:700;padding:7px 10px;cursor:pointer}

  .view{display:none;flex:1 1 auto;min-height:0}
  .view.active{display:flex;flex-direction:column}
  .filters{display:flex;gap:6px;flex-wrap:wrap;padding:8px 14px;border-bottom:1px solid var(--line);background:var(--panel);z-index:1000}
  .chip{font-size:12px;padding:5px 10px;border:1px solid var(--line);border-radius:999px;background:transparent;color:var(--muted);cursor:pointer;white-space:nowrap;transition:.15s}
  .chip.active{background:var(--accent);color:#1a1a1a;border-color:var(--accent);font-weight:600}
  .chip .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;vertical-align:middle}
  #map{flex:1 1 auto;width:100%;min-height:0;height:100%}
  .leaflet-popup-content-wrapper{background:var(--panel);color:var(--txt);border-radius:12px;box-shadow:0 8px 30px rgba(0,0,0,.5)}

  .leaflet-popup-content{margin:12px 14px;font-size:13px;line-height:1.45;width:250px!important}
  .pop-name{font-size:15px;font-weight:700;margin-bottom:2px}
  .pop-dist{font-size:11px;color:var(--accent);text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px}

  .pop-row span{font-size:12px}
  .pop-note{margin-top:8px;padding-top:8px;border-top:1px solid var(--line);font-size:12px;font-style:italic;color:var(--muted)}
  .pop-maps{display:inline-block;margin-top:9px;font-size:12px;color:var(--accent);text-decoration:none;font-weight:600}
  .pop-call{display:block;margin-top:9px;padding:9px;text-align:center;border-radius:8px;text-decoration:none;font-weight:700;font-size:13px;background:#1f5132;color:#aef0c4}
  .pop-call.alt{background:#2a3a5a;color:#bcd6ff}
  .badge{display:inline-block;font-size:10px;padding:2px 7px;border-radius:999px;margin-right:4px;margin-top:6px}
  .b-free{background:#1f5132;color:#7ee0a0}
  .b-paid{background:#5a2020;color:#ff9b8a}
  .b-res{background:#2a3a5a;color:#9fc2ff}
  .leaflet-bar a{background:var(--panel);color:var(--txt);border-color:var(--line)}
  .count{font-size:11px;color:var(--muted);padding:4px 14px;background:var(--panel)}
  .schedule-tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:9px 14px;border-bottom:1px solid var(--line);background:var(--panel);z-index:1000}

  .match-card{display:grid;grid-template-columns:74px minmax(0,1fr) auto;gap:12px;align-items:center;padding:11px 12px;margin-bottom:8px;border:1px solid var(--line);border-radius:8px;background:var(--panel)}

  .match-time{display:flex;flex-direction:column;gap:2px;color:var(--txt)}

  .match-meta{font-size:11px;color:var(--muted);margin-bottom:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .match-teams{display:flex;align-items:center;gap:8px;min-width:0;font-size:15px;font-weight:750}

  .score{font-size:15px;color:var(--accent);font-weight:800;white-space:nowrap}

  #game-canvas{width:100%;height:100%;display:block;touch-action:none}
  #game-ui{position:absolute;inset:0;pointer-events:none;display:flex;flex-direction:column;align-items:center}

  #game-over-text{font-size:22px;font-weight:800;color:var(--txt);text-align:center;padding:0 20px}

  .preview-text{font-size:12px;line-height:1.6;color:var(--txt);margin:0}
  .preview-attr{font-size:10px;color:var(--muted);margin-top:6px;text-align:right}

    .view-tab{flex:1}
    .schedule-tools{padding:8px 10px}
    .schedule-count{padding:5px 10px}
    .schedule-list{padding:10px}
    .match-card{grid-template-columns:58px minmax(0,1fr);gap:10px}
    .match-status{grid-column:2;justify-self:start}
    .match-time strong{font-size:17px}
    .match-teams{font-size:14px;align-items:flex-start;flex-direction:column;gap:4px}
    .score{font-size:14px}

</style>
</head>

const map = L.map('map',{zoomControl:true}).setView([52.510,13.404],11);
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{
  attribution:'© OpenStreetMap contributors', maxZoom:19
}).addTo(map);

function pin(color){
  return L.divIcon({
    className:'',
    html:`<div style="width:20px;height:20px;background:${color};border:2.5px solid #0f1115;border-radius:50% 50% 50% 0;transform:rotate(-45deg);box-shadow:0 2px 6px rgba(0,0,0,.6)"></div>`,
    iconSize:[20,20], iconAnchor:[10,18], popupAnchor:[0,-18]
  });
}

let active = "all";
const markers = [];

places.forEach(p=>{
  const cat = cats[p.c];
  const m = L.marker([p.lat,p.lng],{icon:pin(cat.color)});
  const q = encodeURIComponent(p.n+", "+p.adr+" Berlin");
  let badges = p.free ? '<span class="badge b-free">Eintritt frei</span>' : '<span class="badge b-paid">kostenpflichtig</span>';
  if(p.reso) badges += '<span class="badge b-res">Reservierung</span>';
  const telClean = p.tel ? p.tel.replace(/[^+\d]/g,'') : '';
  const callBtn = p.tel
    ? `<a class="pop-call" href="tel:${telClean}">📞 Anrufen · ${p.tel}</a>`
    : `<a class="pop-call alt" href="https://www.google.com/maps/search/?api=1&query=${q}" target="_blank">📞 Nummer via Google Maps</a>`;
  m.bindPopup(`
    <div class="pop-name">${p.n}</div>
    <div class="pop-dist">${p.d} · ${cat.label}</div>
    <div class="pop-row"><b>Format</b><span>${p.fmt}</span></div>
    <div class="pop-row"><b>Spiele</b><span>${p.sp}</span></div>
    <div class="pop-row"><b>Eintritt</b><span>${p.ein}</span></div>
    <div class="pop-row"><b>Reservierung</b><span>${p.res}</span></div>
    <div class="pop-row"><b>Adresse</b><span>${p.adr} Berlin</span></div>
    <div class="pop-row"><b>Anfahrt</b><span>${p.bahn}</span></div>
    <div>${badges}</div>
    <div class="pop-note">${p.note}</div>
    ${callBtn}
    <a class="pop-maps" href="https://www.google.com/maps/search/?api=1&query=${q}" target="_blank">In Google Maps öffnen →</a>
  `,{maxWidth:280});
  m._cat = p.c;
  markers.push(m);
  m.addTo(map);
});

// Filters
const fbox = document.getElementById('filters');
const allChip = document.createElement('button');
allChip.className='chip active'; allChip.textContent='Alle'; allChip.dataset.c='all';
fbox.appendChild(allChip);
Object.entries(cats).forEach(([k,v])=>{
  const b=document.createElement('button');
  b.className='chip'; b.dataset.c=k;
  b.innerHTML=`<span class="dot" style="background:${v.color}"></span>${v.label}`;
  fbox.appendChild(b);
});

function applyFilter(c){
  active=c;
  fbox.querySelectorAll('.chip').forEach(ch=>ch.classList.toggle('active',ch.dataset.c===c));
  let visible=0;
  markers.forEach(m=>{
    if(c==='all'||m._cat===c){ if(!map.hasLayer(m)) m.addTo(map); visible++; }
    else { if(map.hasLayer(m)) map.removeLayer(m); }
  });
  document.getElementById('count').textContent = `${visible} von ${places.length} Locations werden angezeigt`;
}
fbox.addEventListener('click',e=>{ const ch=e.target.closest('.chip'); if(ch) applyFilter(ch.dataset.c); });
applyFilter('all');

document.querySelector('.view-tabs').addEventListener('click',e=>{
  const tab=e.target.closest('.view-tab');
  if(!tab) return;
  document.querySelectorAll('.view-tab').forEach(btn=>btn.classList.toggle('active',btn===tab));
  document.querySelectorAll('.view').forEach(view=>view.classList.toggle('active',view.id===`${tab.dataset.view}-view`));
  if(tab.dataset.view==='map') setTimeout(fixSize, 80);
  if(tab.dataset.view==='schedule'){
    scheduleShouldFocus = true;
    requestAnimationFrame(focusCurrentMatch);
  }
});

const scheduleList = document.getElementById('schedule-list');
const scheduleCount = document.getElementById('schedule-count');
const scheduleSearch = document.getElementById('schedule-search');
let matches = [];
let scheduleStage = 'all';
let scheduleShouldFocus = false;
const matchDataUpdated = '13.06.2026';

const dateLabelFmt = new Intl.DateTimeFormat('de-DE', {
  timeZone:'Europe/Berlin',
  weekday:'short',
  day:'2-digit',
  month:'long'
});
const timeLabelFmt = new Intl.DateTimeFormat('de-DE', {
  timeZone:'Europe/Berlin',
  hour:'2-digit',
  minute:'2-digit',
  hour12:false
});
const dateKeyFmt = new Intl.DateTimeFormat('en-CA', {
  timeZone:'Europe/Berlin',
  year:'numeric',
  month:'2-digit',
  day:'2-digit'
});

function escapeHtml(value){
  return String(value ?? '').replace(/[&<>"']/g, ch => ({
    '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#039;'
  }[ch]));
}

function berlinDateKey(utc){
  return dateKeyFmt.format(new Date(utc));
}

function matchStatus(m){
  const hasScore = Number.isFinite(m.homeScore) && Number.isFinite(m.awayScore);
  const elapsedMin = (Date.now() - new Date(m.utc).getTime()) / 60000;
  // Treat status=3 as live only if the match could realistically still be in play.
  // 150 min covers 90 min + extra time + penalty shootout. Beyond that, stale data.
  const couldBeLive = elapsedMin >= 0 && elapsedMin < 150;
  if(m.status===3 && couldBeLive) return {text:m.minute ? `Live · ${m.minute}` : 'Live', cls:'live'};
  if(hasScore) return {text:'Beendet', cls:'done'};
  return {text:'Anstoß', cls:''};
}

function findCurrentMatch(){
  const ordered = [...matches].sort((a,b)=>new Date(a.utc) - new Date(b.utc) || a.no - b.no);
  return ordered.find(m=>matchStatus(m).cls !== 'done') || ordered[ordered.length - 1];
}

function focusCurrentMatch(){
  if(!matches.length) return false;
  const current = findCurrentMatch();
  let card = current ? scheduleList.querySelector(`[data-match-no="${current.no}"]`) : null;
  if(!card) card = scheduleList.querySelector('.match-card:not(.done)');
  if(!card) return false;
  card.scrollIntoView({behavior:'smooth', block:'center', inline:'nearest'});
  scheduleShouldFocus = false;
  return true;
}

function renderSchedule(){
  const q = scheduleSearch.value.trim().toLowerCase();
  const visible = matches.filter(m=>{
    const stageOk = scheduleStage==='all' || m.stage===scheduleStage;
    const haystack = [
      m.no, m.stage, m.group, m.home, m.away, m.homeCode, m.awayCode, m.city, m.stadium
    ].join(' ').toLowerCase();
    return stageOk && (!q || haystack.includes(q));
  });

  scheduleCount.textContent = `${visible.length} von ${matches.length} Spielen · Anstoßzeiten in Berlin · Stand ${matchDataUpdated}`;
  if(!visible.length){
    scheduleList.innerHTML = '<div class="empty-state">Keine Spiele gefunden.</div>';
    return;
  }

  const groups = new Map();
  visible.forEach(m=>{
    const key = berlinDateKey(m.utc);
    if(!groups.has(key)) groups.set(key, []);
    groups.get(key).push(m);
  });

  scheduleList.innerHTML = Array.from(groups.entries()).map(([,dayMatches])=>{
    const date = new Date(dayMatches[0].utc);
    const title = dateLabelFmt.format(date);
    const cards = dayMatches.map(m=>{
      const status = matchStatus(m);
      const hasScore = Number.isFinite(m.homeScore) && Number.isFinite(m.awayScore);
      const score = hasScore ? `${m.homeScore}:${m.awayScore}` : 'vs';
      const meta = [`Spiel ${m.no}`, m.group || m.stage, m.city].filter(Boolean).join(' · ');
      const codes = [m.homeCode, m.awayCode].filter(Boolean).join(' / ');
      const aiText = m.summary || m.preview || '';
      const aiLabel = m.summary ? '⚡ Zusammenfassung' : '⚡ Vorschau';
      const aiPanelLabel = m.summary ? '⚡ KI-Zusammenfassung' : '⚡ KI-Vorschau';
      return `
        <article class="match-card ${status.cls}" data-match-no="${escapeHtml(m.no)}">
          <div class="match-time">
            <strong>${escapeHtml(timeLabelFmt.format(new Date(m.utc)))}</strong>
            <span>Berlin</span>
          </div>
          <div class="match-main">
            <div class="match-meta">${escapeHtml(meta)}</div>
            <div class="match-teams">
              <span class="team">${escapeHtml(m.home)}</span>
              <span class="score">${escapeHtml(score)}</span>
              <span class="team">${escapeHtml(m.away)}</span>
              ${codes ? `<span class="team-code">${escapeHtml(codes)}</span>` : ''}
            </div>
            <div class="match-place">${escapeHtml(m.stadium)}</div>
            ${aiText ? `<button class="preview-btn" type="button">${escapeHtml(aiLabel)}</button>` : ''}
          </div>
          <div class="match-status ${status.cls}">${escapeHtml(status.text)}</div>
          ${aiText ? `
          <div class="preview-panel">
            <div class="preview-label">${escapeHtml(aiPanelLabel)}</div>
            <p class="preview-text">${escapeHtml(aiText)}</p>
            <div class="preview-attr">LiquidAI</div>
          </div>` : ''}
        </article>
      `;
    }).join('');
    return `<section class="day-group"><h2 class="day-title">${escapeHtml(title)}</h2>${cards}</section>`;
  }).join('');
  if(scheduleShouldFocus && document.getElementById('schedule-view').classList.contains('active')){
    requestAnimationFrame(focusCurrentMatch);
  }
}

document.querySelector('.schedule-tools').addEventListener('click',e=>{
  const chip = e.target.closest('.schedule-chip');
  if(!chip) return;
  scheduleStage = chip.dataset.stage;
  document.querySelectorAll('.schedule-chip').forEach(btn=>btn.classList.toggle('active',btn===chip));
  renderSchedule();
});
scheduleSearch.addEventListener('input', renderSchedule);
scheduleList.addEventListener('click', e=>{
  if(e.target.classList.contains('preview-btn'))
    e.target.closest('.match-card').classList.toggle('preview-open');
});

fetch('matches.json')
  .then(response => {
    if(!response.ok) throw new Error(`HTTP ${response.status}`);
    return response.json();
  })
  .then(data => {
    matches = data;
    renderSchedule();
  })
  .catch(() => {
    scheduleCount.textContent = 'Spielplan konnte nicht geladen werden';
    scheduleList.innerHTML = '<div class="empty-state">matches.json ist nicht erreichbar.</div>';
  });

// Force Leaflet to re-measure its container once layout has settled,
// otherwise tiles aren't requested if the map initialised at zero height.
function fixSize(){ map.invalidateSize(true); }
setTimeout(fixSize, 100);
setTimeout(fixSize, 500);
window.addEventListener('resize', fixSize);
window.addEventListener('load', fixSize);
</script>
