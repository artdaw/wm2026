<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <!-- Background -->
  <rect width="1200" height="630" fill="#0f1115"/>

  <!-- Subtle grid texture -->
  <defs>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#1a1d25" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#ffcf33" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#0f1115" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="ballClip">
      <circle cx="960" cy="315" r="195"/>
    </clipPath>
  </defs>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- Left accent bar -->
  <rect x="0" y="0" width="6" height="630" fill="#ffcf33"/>

  <!-- Large decorative soccer ball (right side) -->
  <circle cx="960" cy="315" r="195" fill="#171a21" stroke="#262b35" stroke-width="2"/>
  <!-- Ball patches -->
  <path d="M960 210 L1031 263 L1004 351 L916 351 L889 263 Z" fill="#1e2130" stroke="#262b35" stroke-width="1.5" clip-path="url(#ballClip)"/>
  <path d="M1004 351 L1060 400 L1022 474 L898 474 L860 400 L916 351 Z" fill="#1e2130" stroke="#262b35" stroke-width="1.5" clip-path="url(#ballClip)"/>
  <path d="M1031 263 L1110 239 L1150 315 L1110 390 L1060 400 L1004 351 Z" fill="#1e2130" stroke="#262b35" stroke-width="1.5" clip-path="url(#ballClip)"/>
  <path d="M889 263 L810 239 L770 315 L810 390 L860 400 L916 351 Z" fill="#1e2130" stroke="#262b35" stroke-width="1.5" clip-path="url(#ballClip)"/>
  <path d="M960 155 L1041 179 L1031 263 L960 210 L889 263 L879 179 Z" fill="#1e2130" stroke="#262b35" stroke-width="1.5" clip-path="url(#ballClip)"/>
  <circle cx="960" cy="315" r="195" fill="none" stroke="#ffcf33" stroke-width="3" stroke-opacity="0.5"/>

  <!-- Main content -->
  <!-- Eyebrow -->
  <text x="80" y="168" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="22" font-weight="700" fill="#ffcf33" letter-spacing="4">WM 2026 · BERLIN</text>

  <!-- Main headline -->
  <text x="80" y="278" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="88" font-weight="800" fill="#e8eaed" letter-spacing="-2">Public</text>
  <text x="80" y="378" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="88" font-weight="800" fill="#ffcf33" letter-spacing="-2">Viewing</text>

  <!-- Divider line -->
  <rect x="80" y="410" width="480" height="3" fill="#262b35"/>

  <!-- Subtitle -->
  <text x="80" y="460" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="28" font-weight="400" fill="#9aa3b2">46 Locations · Kneipen · Spielplan · Elfmeterschießen</text>

  <!-- URL at bottom -->
  <text x="80" y="566" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="22" font-weight="600" fill="#ffcf33" opacity="0.7">wm2026.artdaw.com</text>
</svg>
