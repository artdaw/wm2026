<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Dark rounded square background -->
  <rect width="64" height="64" rx="14" fill="#0f1115"/>

  <!-- Soccer ball base -->
  <circle cx="32" cy="32" r="21" fill="#e8eaed"/>

  <!-- Classic soccer ball patches (truncated icosahedron front view) -->
  <!-- Center pentagon -->
  <path d="M32 20 L38.7 24.9 L36.2 32.8 L27.8 32.8 L25.3 24.9 Z" fill="#1a1c24"/>

  <!-- Lower pentagon -->
  <path d="M36.2 32.8 L41.5 37.8 L37.8 45 L26.2 45 L22.5 37.8 L27.8 32.8 Z" fill="#1a1c24"/>

  <!-- Upper-right pentagon -->
  <path d="M38.7 24.9 L46.8 22.5 L51 30 L46 35.5 L41.5 37.8 L36.2 32.8 Z" fill="#1a1c24" opacity="0.45"/>

  <!-- Upper-left pentagon -->
  <path d="M25.3 24.9 L17.2 22.5 L13 30 L18 35.5 L22.5 37.8 L27.8 32.8 Z" fill="#1a1c24" opacity="0.45"/>

  <!-- Top pentagon -->
  <path d="M32 11 L40 15 L38.7 24.9 L32 20 L25.3 24.9 L24 15 Z" fill="#1a1c24" opacity="0.7"/>

  <!-- Ball outline with gold accent -->
  <circle cx="32" cy="32" r="21" fill="none" stroke="#ffcf33" stroke-width="2"/>
</svg>
